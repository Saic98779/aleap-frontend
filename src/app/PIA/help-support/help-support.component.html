<main class="mt-4">
  <section>
    <div class="container-fluid">
      <div class="card mb-3">
        <div class="card-header bg-transparent">
          <div class="row align-items-center">
            <div class="col">
              <h6 class="fw-600 mb-0">Help & Support - Ticket Management</h6>
            </div>
            <!-- <div class="col-auto" *ngIf="activeTab==='nav-twos'">
              <button type="button" class="btn btn-lime-green btn-sm" (click)="openTicketModal('add')">
                <i class="fas fa-plus"></i> Add New Ticket
              </button>
            </div> -->
          </div>
        </div>
        <div class="card-body">
          <nav>
            <div class="nav nav-tabs mb-3" id="nav-tab" role="tablist">
              <button [ngClass]="{ 'active':activeTab==='nav-twos'}" (click)="onTabChange('nav-twos')"
                class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-twos" type="button"
                role="tab" aria-controls="nav-home" aria-selected="true"> In-Progress Tickets</button>
              <button [ngClass]="{ 'active':activeTab==='nav-ones'}" (click)="onTabChange('nav-ones')"
                class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-ones" type="button"
                role="tab" aria-controls="nav-home" aria-selected="true"> Closed Tickets</button>

            </div>
          </nav>
          <div class="tab-content border bg-light" id="nav-tabContent">
             <div class="tab-pane fade active show" id="nav-twos" role="tabpanel" aria-labelledby="nav-home-tab"
              [ngClass]="{ 'active':activeTab==='nav-twos'}" *ngIf="activeTab==='nav-twos'">
              <app-inprogress-tickets></app-inprogress-tickets>

            </div>
           
            <div class="tab-pane fade active show" id="nav-ones" role="tabpanel" aria-labelledby="nav-home-tab"
              [ngClass]="{ 'active':activeTab==='nav-ones'}" *ngIf="activeTab==='nav-ones'">
              <app-closed-tickets></app-closed-tickets>

            </div>
          </div>


        </div>
      </div>

    </div>
  </section>
</main>
